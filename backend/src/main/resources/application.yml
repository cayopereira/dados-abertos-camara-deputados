spring:
  application:
    name: camara-api

  datasource:
    url: jdbc:postgresql://localhost:5432/camara
    username: camara
    password: camara123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate   # Flyway gerencia o schema
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

# Configurações da API externa
camara:
  api:
    base-url: https://dadosabertos.camara.leg.br/api/v2
    legislatura-atual: 57   # 2023-2027